<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>End of session sounds · Infinite Voidsong</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/legal.css" />
  <style>
    .chime { border-top: 1px solid var(--red); padding: 1.25rem 0 1.5rem; }
    .chime h2 { margin-top: 0; }
    .chime button { font: inherit; padding: .7rem 1.6rem; border: 1px solid var(--red); background: var(--red); color: var(--chalk); cursor: pointer; letter-spacing: .06em; text-transform: uppercase; }
    .chime button:hover, .chime button:focus-visible { background: transparent; color: var(--red-text); }
    .level { display: flex; gap: 1rem; align-items: center; margin: 1.5rem 0 2rem; }
    .level input { flex: 1; }
  </style>
</head>
<body>
  <main id="main" class="page">
    <h1>End of session sounds</h1>
    <p>Three arpeggios in C major, up and down. Press to listen, pick one, and tell me which.</p>
    <label class="level">Level <input id="level" type="range" min="0.05" max="0.6" step="0.01" value="0.3" /></label>
    <div id="list"></div>
  </main>
  <script type="module" src="/src/ui/chimes-preview.ts"></script>
</body>
</html>
